name: build

on:
  push:
    branches:
      - master
      - ci-build-artifact
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - run: xcodebuild -scheme Stats -destination 'platform=macOS' -configuration Release archive CODE_SIGNING_ALLOWED=NO -archivePath build/Stats.xcarchive
      - run: ditto -c -k --keepParent build/Stats.xcarchive/Products/Applications/Stats.app build/Stats-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Stats-unsigned
          path: build/Stats-unsigned.zip
